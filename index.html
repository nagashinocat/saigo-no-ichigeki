<!doctype html>
<html lang="ja">
<head>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d16; }
    #game, #hud, #start, #result { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #game { display: block; width: 100%; height: 100%; }
    body { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #fff; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    .hud-strip { position: absolute; display: flex; justify-content: space-between; align-items: flex-start; box-sizing: border-box; padding: 0.6em 4vw 0; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.85), 0 0 10px rgba(20, 10, 30, 0.5); }
    .hud-left { min-width: 0; }
    /* R2（spec §15 届く範囲の輪）: 上の帯の左に「届かない軍勢 あと N 体」（小さな見出しと大きな数）。0 体で「今なら全滅できる」がほのかに光る */
    .hud-reach { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; white-space: nowrap; }
    .hud-rhead { font-size: clamp(11px, 3vw, 15px); font-weight: 800; opacity: 0.95; letter-spacing: 0.04em; color: #ffd9cc; }
    .hud-rbody { font-size: clamp(17px, 5vw, 26px); font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 0.1em; color: #ffe9e2; }
    .hud-reach.ready .hud-rhead { color: #fff3c8; opacity: 0.95; }
    .hud-reach.ready .hud-rbody { color: #fff8e4; text-shadow: 0 0 10px rgba(255, 214, 120, 0.85), 0 0 22px rgba(255, 170, 60, 0.55), 0 1px 3px rgba(20, 10, 30, 0.85); animation: reach-glow 1.6s ease-in-out infinite; }
    .hud-reach.ready { text-shadow: 0 0 8px rgba(255, 214, 120, 0.6); }
    /* 輪が画面の外（もっと外まで届く）: 街の画面の縁を内側からほのかに光らせる。濃さは hud.js（軍勢をまたぐと脈打つ） */
    .hud-edge { position: absolute; opacity: 0; box-shadow: inset 0 0 0 2px rgba(255, 158, 56, 0.85), inset 0 0 30px rgba(255, 140, 40, 0.55); }
    .hud-edge.ready { box-shadow: inset 0 0 0 2px rgba(255, 236, 178, 0.9), inset 0 0 30px rgba(255, 214, 120, 0.55); }
    .hud-edge:not(.on) { display: none; }
    @keyframes reach-glow { 0%, 100% { opacity: 0.88; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .hud-reach.ready .hud-rbody { animation: none; } }
    .hud-right { display: flex; flex-direction: column; align-items: flex-end; }
    /* R1c（持ち主 11:03「制限時間もわかりやすくしよう」）: 上の帯の右に大きな数字（秒）と、その下の減っていく細い帯。
       残り 10 秒（.last）から琥珀 → 赤（色は hud.js が --tcol と数字の color に入れる）、数字は 1 秒に 1 回脈打つ（transform も hud.js） */
    .hud-time { display: flex; flex-direction: column; align-items: flex-end; --tcol: currentColor; }
    .hud-tline { display: flex; align-items: baseline; gap: 0.15em; line-height: 1; }
    .hud-tnum { font-size: clamp(34px, 10vw, 54px); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; transform-origin: 70% 60%; will-change: transform; }
    .hud-tunit { font-size: clamp(11px, 3vw, 15px); font-weight: 700; opacity: 0.8; }
    .hud-tbar { position: relative; width: clamp(64px, 20vw, 120px); height: 4px; margin-top: 0.3em; border-radius: 999px; overflow: hidden; background: rgba(8, 4, 14, 0.6); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 1px 3px rgba(0, 0, 0, 0.5); }
    .hud-tfill { position: absolute; right: 0; top: 0; bottom: 0; width: 100%; border-radius: inherit; background: rgba(255, 255, 255, 0.92); box-shadow: 0 0 6px rgba(255, 255, 255, 0.6); }
    .hud-time.last .hud-tfill { background: var(--tcol); box-shadow: 0 0 8px var(--tcol); }
    .hud-time.last .hud-tunit { color: var(--tcol); opacity: 1; }
    .hud-army { font-size: clamp(11px, 3vw, 15px); font-weight: 700; opacity: 0.85; margin-top: 0.15em; color: #c9f5d8; font-variant-numeric: tabular-nums; }
    /* R1b（持ち主 08:24「力のパーセントをもう少しわかりやすく」）: 手の帯の上端の太いゲージと、撃退ラインの目盛り。
       色は段で変わる: 撃退ライン未満は琥珀、以上は白熱、満タンはゆっくり脈打つ。吸われて減った分は赤紫の影が遅れて縮む */
    .hud-gauge { position: absolute; --drain: 0; }
    .hud-track { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; background: rgba(8, 4, 14, 0.62); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 1px 4px rgba(0, 0, 0, 0.5); }
    .hud-track i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); border-radius: inherit; }
    .hud-ghost { background: rgba(255, 70, 190, 0.85); }
    .hud-fill { background: linear-gradient(90deg, #c96a12, #ffb347 60%, #ffd98a); box-shadow: 0 0 10px rgba(255, 170, 60, 0.7); }
    /* R1b fix1: 吸われている間、ゲージの埋まった所が赤紫に脈打つ（不透明度 --drain は hud.js が drainFx の脈打ちから決める） */
    .hud-pulse { background: linear-gradient(90deg, #b01a86, #ff4fc8 70%, #ff9ae0); box-shadow: 0 0 12px rgba(255, 60, 180, 0.9); opacity: var(--drain); }
    .hud-gauge.ready .hud-fill, .hud-gauge.full .hud-fill { background: linear-gradient(90deg, #ffd27a, #fff6e2 45%, #ffffff); box-shadow: 0 0 14px rgba(255, 244, 220, 0.95); }
    .hud-gauge.full .hud-track { animation: hud-full 1.3s ease-in-out infinite; }
    .hud-tick { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(20, 10, 30, 0.75), 0 0 6px rgba(255, 255, 255, 0.8); }
    .hud-tick-label { position: absolute; top: calc(100% + 6px); transform: translateX(-100%); padding-right: 0.5em; white-space: nowrap; font-size: clamp(10px, 2.7vw, 13px); font-weight: 700; letter-spacing: 0.12em; opacity: 0.62; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.9); }
    .hud-gauge.ready .hud-tick-label, .hud-gauge.full .hud-tick-label { opacity: 0.9; }
    @keyframes hud-full { 0%, 100% { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3), 0 0 6px rgba(255, 240, 210, 0.5); } 50% { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 0 22px rgba(255, 244, 220, 1); } }
    /* 大きな数字（手の帯の上端の一列の左。ゲージはその右） */
    .hud-pct { position: absolute; display: flex; align-items: baseline; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; color: rgb(255, 190, 92); text-shadow: 0 2px 4px rgba(20, 10, 30, 0.9), 0 0 16px rgba(255, 150, 40, 0.45); }
    .hud-pct small { font-size: 0.34em; font-weight: 800; margin-right: 0.3em; opacity: 0.8; align-self: center; color: #fff; }
    .hud-pct b { font-weight: 900; letter-spacing: -0.01em; }
    .hud-pct em { font-style: normal; font-size: 0.5em; font-weight: 800; margin-left: 0.04em; }
    .hud-pct.ready { color: rgb(255, 250, 236); text-shadow: 0 2px 4px rgba(20, 10, 30, 0.9), 0 0 18px rgba(255, 240, 200, 0.9); }
    .hud-pct.full { color: #fff; animation: hud-full-num 1.3s ease-in-out infinite; }
    @keyframes hud-full-num { 0%, 100% { text-shadow: 0 2px 4px rgba(20, 10, 30, 0.9), 0 0 12px rgba(255, 240, 200, 0.6); } 50% { text-shadow: 0 2px 4px rgba(20, 10, 30, 0.9), 0 0 30px rgba(255, 250, 230, 1), 0 0 8px #fff; } }
    .hud-pct.draining { text-shadow: 0 2px 4px rgba(20, 10, 30, 0.9), 0 0 18px rgba(255, 60, 180, 0.8); }
    .hud-lost { position: absolute; left: 0.2em; top: calc(100% + 5px); font-size: clamp(13px, 3.6vw, 17px); font-weight: 900; font-variant-numeric: tabular-nums; color: #ff6fd0; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.95), 0 0 10px rgba(255, 60, 180, 0.7); opacity: 0; }
    /* 吸われている間の画面の縁（赤紫の脈打ち。真ん中は暗くしない。濃さと速さは drainFx.js が決める。R1b fix1: 帯を広く、色を濃く） */
    .hud-drain { position: fixed; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(ellipse 74% 66% at 50% 45%, rgba(200, 20, 140, 0) 34%, rgba(235, 30, 160, 0.55) 62%, rgba(255, 45, 175, 0.92) 84%, rgb(255, 70, 190) 100%); }
    /* 払える量に足りない: 押した所に小さく */
    .hud-short { position: absolute; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; white-space: nowrap; font-size: clamp(13px, 3.6vw, 17px); font-weight: 800; color: #ffd0e8; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.95), 0 0 8px rgba(255, 60, 160, 0.6); }
    /* M2: 残りの払える回数（3 つの点）。使った点は暗い輪だけ。位置は hud.js（スティックの輪のすぐ上か、力の数字の上） */
    .hud-pips { position: absolute; display: flex; gap: 7px; transform: translate(-50%, -50%); pointer-events: none; }
    .hud-pips i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff9ec, #ffc46a 70%); box-shadow: 0 0 0 1.5px rgba(20, 10, 30, 0.85), 0 0 8px rgba(255, 200, 110, 0.85); transition: transform 0.2s, opacity 0.2s; }
    .hud-pips i.used { background: rgba(20, 10, 30, 0.35); box-shadow: inset 0 0 0 1.5px rgba(255, 236, 200, 0.55); }
    .hud-pips.out i { animation: hud-pips-out 0.5s ease-out; }
    @keyframes hud-pips-out { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
    .hud-short.show { animation: hud-short 0.9s ease-out forwards; }
    @keyframes hud-short { 0% { opacity: 0; transform: translate(-50%, -30%) scale(1.15); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -85%); } }
    @media (prefers-reduced-motion: reduce) { .hud-gauge.full .hud-track, .hud-pct.full { animation: none; } }
    .hud-hint { position: absolute; text-align: center; font-size: clamp(14px, 4vw, 20px); font-weight: 800; opacity: 0; transition: opacity 0.25s; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.9), 0 0 10px rgba(20, 10, 30, 0.6); }
    .hud-hint.show { opacity: 1; transition: opacity 0.08s; }
    /* R1 まとめて払った「×k」: 主人公の少し上に小さく跳ねて、すぐ消える（群がる軍勢には重ねない） */
    .hud-combo { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; line-height: 1; opacity: 0; pointer-events: none; padding: 0.25em 0.7em 0.3em; border-radius: 0.6em; background: radial-gradient(closest-side, rgba(24, 10, 4, 0.62), rgba(24, 10, 4, 0.38) 70%, rgba(24, 10, 4, 0)); }
    .hud-combo b { font-size: clamp(22px, 6.4vw, 32px); font-weight: 900; font-style: italic; letter-spacing: 0.02em; color: #fff7e0; -webkit-text-stroke: 1px rgba(60, 25, 5, 0.85); text-shadow: 0 0 10px rgba(255, 170, 60, 0.85), 0 2px 3px rgba(20, 10, 30, 0.9); font-variant-numeric: tabular-nums; }
    .hud-combo.show { animation: hud-combo 1.05s ease-out forwards; }
    @keyframes hud-combo { 0% { opacity: 0; transform: translate(-50%, -30%) scale(1.5); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(0.95); } 18% { transform: translate(-50%, -50%) scale(1); } 65% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
    /* R1 大物が来た知らせ: 街の画面の上の方に、細い光の線にはさまれた大きな文字が閃いて消える */
    .hud-announce { position: absolute; text-align: center; opacity: 0; pointer-events: none; }
    .hud-announce span { display: inline-block; padding: 0.18em 0.9em; font-size: clamp(26px, 8.2vw, 44px); font-weight: 900; letter-spacing: 0.22em; color: #fff1d0; text-shadow: 0 0 14px rgba(255, 150, 40, 0.95), 0 0 30px rgba(255, 90, 20, 0.6), 0 2px 4px rgba(20, 10, 30, 0.95);
      border-top: 2px solid rgba(255, 196, 110, 0.9); border-bottom: 2px solid rgba(255, 196, 110, 0.9); background: linear-gradient(90deg, rgba(40, 14, 6, 0), rgba(40, 14, 6, 0.55) 20%, rgba(40, 14, 6, 0.55) 80%, rgba(40, 14, 6, 0)); }
    .hud-announce.show { animation: hud-announce 2.4s ease-out forwards; }
    @keyframes hud-announce { 0% { opacity: 0; transform: scaleX(1.6); filter: brightness(3); } 8% { opacity: 1; transform: scaleX(1); filter: brightness(1.6); } 14% { opacity: 0.55; } 20% { opacity: 1; filter: brightness(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: scaleX(1.04); } }
    /* M1: 上の帯の真ん中の「中心まで ◯ m」と、街の中心への小さな矢印（右向きの三角を回す） */
    .hud-centre { position: absolute; display: flex; align-items: center; justify-content: center; gap: 0.45em; font-size: clamp(12px, 3.3vw, 16px); font-weight: 800; color: #fff3d8; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.9), 0 0 8px rgba(20, 10, 30, 0.55); }
    .hud-arrow { display: inline-block; width: 0; height: 0; border-top: 0.27em solid transparent; border-bottom: 0.27em solid transparent; border-left: 1em solid #ffd27a; filter: drop-shadow(0 0 3px rgba(255, 170, 60, 0.8)); transform-origin: 40% 50%; }
    .hud-centre.near .hud-arrow { width: 0.6em; height: 0.6em; border: 0; border-radius: 50%; background: #ffd27a; transform: none !important; }
    /* M1: 溜めている間の 2 本目の指で出る、浮かぶジョイスティック（輪とつまみ） */
    #stick { position: fixed; left: 0; top: 0; pointer-events: none; display: none; }
    #stick.on { display: block; }
    #stick .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(255, 236, 200, 0.75); background: radial-gradient(closest-side, rgba(40, 20, 10, 0.12), rgba(40, 20, 10, 0.34)); box-shadow: 0 0 12px rgba(255, 180, 90, 0.35); transform: translate(-50%, -50%); }
    /* M2: 輪の外側の軍勢の向きの印（小さな菱形。追う・近づく者は赤く、大物は大きな琥珀、重い者は二重の縁、吸う者は赤紫）。
       位置・向き・濃さ・大きさは joystick.js が transform / opacity に入れる */
    #stick .mark { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; transform-origin: 4.5px 4.5px; background: #fff3dc; border-radius: 2px; box-shadow: 0 0 0 1px rgba(20, 10, 30, 0.8), 0 0 6px rgba(255, 240, 210, 0.7); }
    #stick .mark.chase { background: #ff6a4a; box-shadow: 0 0 0 1px rgba(20, 10, 30, 0.85), 0 0 8px rgba(255, 90, 60, 0.9); }
    #stick .mark.heavy { background: #ffb347; box-shadow: 0 0 0 1px rgba(20, 10, 30, 0.85), 0 0 0 3px #ffb347, 0 0 0 4px rgba(20, 10, 30, 0.85); }
    #stick .mark.drainer { background: #ff2f8a; border-radius: 50%; box-shadow: 0 0 0 1px rgba(20, 10, 30, 0.85), 0 0 8px rgba(255, 40, 140, 0.9); }
    #stick .mark.boss { width: 14px; height: 14px; margin: -7px 0 0 -7px; transform-origin: 7px 7px; background: #ffd27a; box-shadow: 0 0 0 2px rgba(20, 10, 30, 0.9), 0 0 12px rgba(255, 200, 90, 1); }
    /* R1e: 印の輪の目安の薄い丸（印は joystick.js が輪の半径に置く）。つまみはいつも印より上（印がつまみを覆わない） */
    #stick .radar { position: absolute; border-radius: 50%; border: 1.5px dashed rgba(255, 236, 200, 0.28); transform: translate(-50%, -50%); }
    #stick .mark { z-index: 1; }
    /* R1e（持ち主 16:55）: 見つかりそうなときの「LOOK OUT!」と、隠れられる物陰の向きの矢印（lookoutView.js）。新しい字体は読み込まず、
       太いシステムの字に縁取り・傾き・弾む出方でポップに。R1f（持ち主 18:14「LOOK OUT!の矢印をタップ」）: 矢印は大きな丸い当たり（直径 88 px、
       脈打つ輪と「TAP」）の真ん中。当たりの判定は JS（pointer-events は付けない: 溜め・スティックの指を奪わない） */
    /* R1f（持ち主 18:14「一時停止、リトライ、音量調節ができるメニューボタン」）: 右上の残り時間の下の ≡（指が届く 44 px の当たり）と、一時停止のメニュー。
       canvas の上の DOM なので、触れても溜め・スティックにならない（ui/menu.js が指の知らせを止める） */
    #menuBtn { position: fixed; right: max(8px, env(safe-area-inset-right)); top: calc(max(6px, env(safe-area-inset-top)) + clamp(78px, 21vw, 100px)); width: 44px; height: 44px; z-index: 6;
      border: 0; border-radius: 12px; background: rgba(12, 6, 22, 0.55); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0; touch-action: manipulation; }
    #menuBtn i { display: block; width: 20px; height: 3px; border-radius: 2px; background: #ffe9e2; }
    #menuBtn[hidden], #menu[hidden] { display: none; }
    @media (orientation: landscape) { #menuBtn { top: max(8px, env(safe-area-inset-top)); right: calc(max(8px, env(safe-area-inset-right)) + clamp(110px, 18vw, 170px)); } }
    #menu { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(6, 2, 14, 0.62); touch-action: none; }
    #menu .menu-card { width: min(320px, 86vw); max-height: 92vh; overflow: auto; padding: 18px 18px 14px; border-radius: 18px; background: #1c1030; box-shadow: 0 0 0 2px #ffe14a, 0 10px 40px rgba(0, 0, 0, 0.6); color: #fff4e8; font: 700 16px/1.3 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; gap: 10px; }
    #menu .menu-title { font-size: 20px; font-weight: 900; text-align: center; letter-spacing: 0.1em; color: #ffe14a; }
    #menu button { min-height: 48px; border: 0; border-radius: 12px; font: 900 18px/1 system-ui, -apple-system, sans-serif; color: #fff4e8; background: #3a2458; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
    #menu button.menu-main { background: #ffe14a; color: #2a0f3a; }
    #menu .menu-vol { display: grid; grid-template-columns: 4.5em 1fr; align-items: center; gap: 8px; font-size: 15px; }
    #menu input[type=range] { width: 100%; height: 32px; accent-color: #ffe14a; }
    @media (orientation: landscape) and (max-height: 500px) { #menu .menu-card { width: min(520px, 80vw); display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 12px 16px; } #menu .menu-title { grid-column: 1 / -1; } #menu .menu-vol { grid-column: 1 / -1; } }
    /* R1f fix1: 物陰にいる間の「かくれ中」と、その物陰にいられる残り（--p、1 → 0）の細い輪（hideMark.js） */
    #hideMark { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 4; --p: 1; }
    #hideMark[hidden] { display: none; }
    #hideMark .hm-ring { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%;
      background: conic-gradient(rgba(140, 220, 255, 0.95) calc(var(--p) * 360deg), rgba(140, 220, 255, 0.12) 0);
      -webkit-mask: radial-gradient(circle, transparent 22px, #000 23px); mask: radial-gradient(circle, transparent 22px, #000 23px); }
    #hideMark .hm-tag { position: absolute; left: 0; top: -46px; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; border-radius: 999px;
      font: 900 13px/1.2 system-ui, -apple-system, sans-serif; color: #d9f4ff; background: rgba(10, 20, 40, 0.7); box-shadow: 0 0 0 1px rgba(140, 220, 255, 0.6); }
    #lookout { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 5; }
    #lookout .lo-text { position: absolute; left: 0; top: -64px; transform: translate(-50%, -50%) rotate(-8deg); white-space: nowrap;
      font: italic 900 30px/1 system-ui, -apple-system, "Arial Black", "Helvetica Neue", sans-serif; letter-spacing: 0.02em; color: #ffe14a;
      -webkit-text-stroke: 6px #2a0f3a; paint-order: stroke fill; text-shadow: 0 4px 0 #2a0f3a, 0 0 14px rgba(255, 120, 60, 0.85); }
    #lookout.pop .lo-text { animation: lookoutPop 0.42s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
    @keyframes lookoutPop { 0% { transform: translate(-50%, -50%) rotate(-18deg) scale(0.2); opacity: 0; } 55% { transform: translate(-50%, -50%) rotate(-5deg) scale(1.22); opacity: 1; }
      80% { transform: translate(-50%, -50%) rotate(-10deg) scale(0.92); } 100% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); } }
    #lookout .lo-hit { position: absolute; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 225, 74, 0.28) 0 55%, rgba(255, 225, 74, 0) 72%); border: 4px solid #ffe14a;
      box-shadow: 0 0 0 4px #2a0f3a, 0 0 18px rgba(255, 140, 60, 0.9); animation: lookoutRing 0.6s ease-in-out infinite alternate; }
    #lookout .lo-hit::after { content: 'TAP'; position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%) rotate(-6deg);
      font: italic 900 17px/1 system-ui, -apple-system, "Arial Black", sans-serif; color: #fff4c2; -webkit-text-stroke: 4px #2a0f3a; paint-order: stroke fill; }
    @keyframes lookoutRing { from { transform: scale(0.94); } to { transform: scale(1.06); } }
    #lookout .lo-arrow { position: absolute; left: -28px; top: -21px; width: 56px; height: 42px; transform-origin: 50% 50%; }
    #lookout .lo-arrow i { position: absolute; inset: 0; background: #ffe14a; clip-path: polygon(0 32%, 52% 32%, 52% 0, 100% 50%, 52% 100%, 52% 68%, 0 68%);
      animation: lookoutNudge 0.5s ease-in-out infinite alternate; }
    #lookout .lo-arrow b { position: absolute; inset: -4px; background: #2a0f3a; clip-path: polygon(0 28%, 50% 28%, 50% -6%, 104% 50%, 50% 106%, 50% 72%, 0 72%); animation: lookoutNudge 0.5s ease-in-out infinite alternate; }
    @keyframes lookoutNudge { from { translate: -4px 0; } to { translate: 5px 0; } }
    #stick .knob { z-index: 2; position: absolute; border-radius: 50%; background: radial-gradient(circle at 45% 40%, rgba(255, 246, 225, 0.95), rgba(255, 190, 110, 0.85)); box-shadow: 0 0 10px rgba(255, 190, 100, 0.7); transform: translate(-50%, -50%); }
    #start { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; font-size: clamp(16px, 4.6vw, 26px); font-weight: 700; text-shadow: 0 1px 4px rgba(20, 10, 30, 0.9), 0 0 14px rgba(20, 10, 30, 0.6); }
    #start[hidden], #result[hidden], #result [hidden] { display: none; }
    /* R1f: 横画面の #result:not(.fail) { display: grid } が [hidden] に勝って、遊んでいる間も空の結果の画面（もう一度・共有）が出ていた（R3 からの不具合） */
    #result[hidden] { display: none !important; }
    #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4em; background: rgba(12, 8, 24, 0.72); text-align: center; }
    /* 撃退失敗: 後ろの引きの絵（生き残りの光）が読めるよう、真ん中の文字の後ろだけ暗くする */
    /* fix1: 文字は上（引きの絵の帯 fitTop より上）、ボタンは下（fitBot より下）に寄せ、真ん中の帯（生き残りの光）を空けて暗くしない */
    #result.fail { justify-content: flex-start; padding: max(9vh, 48px) 0 max(4vh, 16px); box-sizing: border-box; gap: 0.3em;
      background: linear-gradient(to bottom, rgba(12, 8, 24, 0.82) 0%, rgba(12, 8, 24, 0.7) 30%, rgba(12, 8, 24, 0) 40%, rgba(12, 8, 24, 0) 74%, rgba(12, 8, 24, 0.7) 82%); }
    #result.fail .result-row:not(.sub) { margin-top: auto; }
    #result.fail .result-label { margin-top: 0.4em; }
    /* 横画面: 生き残りの輪は画面の真ん中に大きく出るので、文字は左、ボタンは右の列へ寄せ、真ん中の列（輪）を空けて暗くしない */
    @media (min-aspect-ratio: 1/1) {
      #result.fail { display: grid; grid-template-columns: 1fr 38vw 1fr; grid-template-rows: repeat(10, auto); align-content: center; justify-items: center; align-items: center; column-gap: 0; row-gap: 0.3em; padding: 0 2vw;
        background: linear-gradient(to right, rgba(12, 8, 24, 0.84) 0%, rgba(12, 8, 24, 0.72) 24%, rgba(12, 8, 24, 0) 33%, rgba(12, 8, 24, 0) 67%, rgba(12, 8, 24, 0.72) 76%, rgba(12, 8, 24, 0.84) 100%); }
      #result.fail .result-title { grid-area: 1 / 1; }
      #result.fail .result-city { grid-area: 2 / 1; }
      #result.fail .result-rank { grid-area: 3 / 1; }
      #result.fail .result-headline { grid-area: 4 / 1; font-size: clamp(24px, 4.2vw, 56px); white-space: normal; word-break: keep-all; line-height: 1.15; }
      #result.fail .result-titles { grid-area: 5 / 1; }
      #result.fail .result-label { grid-area: 6 / 1; margin-top: 0.3em; }
      #result.fail .result-amount { grid-area: 7 / 1; }
      #result.fail .result-compare { grid-area: 8 / 1; }
      #result.fail .result-breakdown { grid-area: 9 / 1; }
      #result.fail .result-best { grid-area: 10 / 1; }
      #result.fail .result-row { grid-column: 3; margin: 0; flex-direction: column; align-items: stretch; gap: 0.6em; }
      #result.fail .result-row:not(.sub) { grid-row: 1 / 9; align-self: end; }
      #result.fail .result-row.sub { grid-row: 9 / 11; align-self: start; margin-top: 0.6em; }
    }
    /* R2（spec §15 評価のランク）: ランクは大きく、題字のすぐ下。被害額の下に倍率の内訳を小さな行で */
    .result-rank { display: flex; align-items: baseline; gap: 0.35em; line-height: 1; margin-top: 0.2em; }
    .result-rank small { font-size: clamp(12px, 3.2vw, 16px); font-weight: 700; opacity: 0.7; letter-spacing: 0.2em; }
    .result-rank b { font-size: clamp(72px, 24vw, 140px); font-weight: 900; font-style: italic; letter-spacing: -0.02em; padding-right: 0.08em; color: #e8e2f0; text-shadow: 0 0 18px rgba(200, 190, 255, 0.35); }
    .result-rank.rank-s b { color: #fff4c8; text-shadow: 0 0 34px rgba(255, 196, 80, 0.9), 0 0 8px rgba(255, 236, 180, 0.95); }
    .result-rank.rank-a b { color: #ffe2b8; text-shadow: 0 0 24px rgba(255, 160, 80, 0.6); }
    .result-rank.rank-b b { color: #dfe8ff; text-shadow: 0 0 18px rgba(150, 180, 255, 0.45); }
    .result-rank.rank-c b { color: #b9b0c4; text-shadow: 0 0 12px rgba(120, 100, 150, 0.4); }
    /* 撃退失敗の縦画面: 文字は上の暗い帯（約 4 割）に収める（真ん中の生き残りの光を空ける）。ランクと内訳の分だけ詰める */
    #result.fail .result-rank b { font-size: clamp(36px, 11vw, 72px); }
    #result.fail .result-breakdown { line-height: 1.35; }
    /* 横画面は縦が短い: ランクの字を縦の長さで抑える */
    @media (min-aspect-ratio: 1/1) {
      #result .result-rank b, #result.fail .result-rank b { font-size: clamp(44px, 16vh, 120px); }
      /* 撃退成功・ブラックホールの横画面: 縦が短いので、ランクを左の列に大きく、ほかを右の列に縦に並べる */
      #result:not(.fail) { display: grid; grid-template-columns: auto auto; grid-auto-rows: auto; column-gap: 6vw; row-gap: 0.25em; align-content: center; justify-content: center; justify-items: center; }
      #result:not(.fail) > * { grid-column: 2; }
      #result:not(.fail) > .result-rank { grid-column: 1; grid-row: 1 / span 12; align-self: center; flex-direction: column; align-items: center; gap: 0.1em; }
      #result:not(.fail) .result-rank b { font-size: clamp(64px, 34vh, 180px); }
      #result:not(.fail) .result-headline { font-size: clamp(28px, 10vh, 60px); margin-top: 0; }
      #result:not(.fail) .result-label { margin-top: 0.4em; }
      #result:not(.fail) .result-row { margin-top: 0.7em; }
      #result:not(.fail) .result-row.sub { margin-top: 0.3em; }
    }
    /* R3: 撃退失敗の縦画面は上の暗い帯（約 4 割）に収める: 内訳は一行に、自己ベストはボタンのすぐ上（下の暗い帯）へ */
    #result.fail .result-breakdown { display: flex; justify-content: center; gap: 1.2em; line-height: 1.3; }
    #result.fail .result-label { margin-top: 0.2em; }
    #result.fail .result-best { order: 1; margin-top: auto; }
    #result.fail .result-row { order: 2; }
    #result.fail .result-row:not(.sub) { margin-top: 0.5em; }
    #result.fail .result-row.sub { order: 3; }
    /* R3: 横画面（撃退成功・ブラックホール）: 題字と街の名前もランクと一緒に左の列へ。右の列は詰める */
    @media (min-aspect-ratio: 1/1) {
      #result:not(.fail) { row-gap: 0.15em; }
      #result:not(.fail) > .result-title, #result:not(.fail) > .result-city { grid-column: 1; }
      #result:not(.fail) > .result-title { grid-row: 1; }
      #result:not(.fail) > .result-city { grid-row: 2; }
      #result:not(.fail) > .result-rank { grid-row: 3 / span 10; }
      #result:not(.fail) .result-headline { font-size: clamp(24px, 8.5vh, 56px); }
      #result:not(.fail) .result-label { margin-top: 0.15em; }
      #result:not(.fail) .result-amount { font-size: clamp(20px, 7.5vh, 40px); line-height: 1.1; }
      #result:not(.fail) .result-breakdown { display: flex; gap: 1.2em; line-height: 1.3; margin-top: 0; }
      #result:not(.fail) .result-row { margin-top: 0.4em; }
      #result:not(.fail) .result-row.sub { margin-top: 0.15em; }
      #result:not(.fail) .result-row.sub .result-btn { padding-top: 0.3em; padding-bottom: 0.3em; }
      /* 撃退失敗の横画面: 左の列を詰め、自己ベストは右の列の上（ボタンの列）へ */
      #result.fail { row-gap: 0.2em; }
      #result.fail .result-rank b { font-size: clamp(34px, 12vh, 96px); }
      #result.fail .result-label { margin-top: 0; }
      #result.fail .result-amount { font-size: clamp(20px, 7vh, 40px); line-height: 1.1; }
      #result.fail .result-compare, #result.fail .result-breakdown { max-width: 30vw; }
      #result.fail .result-breakdown { flex-wrap: wrap; gap: 0 1em; }
      #result.fail .result-best { order: 0; margin-top: 0; grid-area: 1 / 3; align-self: start; }
      #result.fail .result-row, #result.fail .result-row.sub { order: 0; }
    }
    /* R3（spec §15 今日の街・被害額のたとえ・称号・自己ベスト）: どれも小さな行。称号は金の縁のバッジ、初めては NEW */
    .result-city { font-size: clamp(11px, 3.1vw, 14px); font-weight: 700; letter-spacing: 0.12em; color: #9fe8ff; opacity: 0.85; }
    .result-titles { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35em 0.5em; max-width: 92vw; margin-top: 0.15em; }
    .result-badge { position: relative; font-size: clamp(12px, 3.4vw, 16px); font-weight: 800; letter-spacing: 0.08em; padding: 0.22em 0.8em; border-radius: 999px;
      color: #fff1c2; background: linear-gradient(180deg, rgba(120, 72, 10, 0.55), rgba(60, 30, 10, 0.55)); border: 1.5px solid rgba(255, 206, 110, 0.85); box-shadow: 0 0 12px rgba(255, 180, 70, 0.35); white-space: nowrap; }
    .result-badge .result-stars { font-size: 0.62em; letter-spacing: 0.05em; margin-left: 0.5em; color: #ffd36b; vertical-align: 0.15em; }
    .result-badge.r4, .result-badge.r5 { border-color: #ffe9a8; box-shadow: 0 0 18px rgba(255, 210, 110, 0.7); background: linear-gradient(180deg, rgba(150, 90, 10, 0.7), rgba(80, 30, 60, 0.6)); }
    .result-badge i, .result-best b { font-style: normal; font-size: 0.68em; font-weight: 900; letter-spacing: 0.04em; color: #2a0f00; background: #ffd93d; border-radius: 4px; padding: 0.05em 0.35em; margin-left: 0.45em; vertical-align: 0.12em; }
    .result-compare { font-size: clamp(11px, 3.1vw, 14px); font-weight: 600; opacity: 0.82; max-width: 92vw; line-height: 1.35; }
    .result-best { font-size: clamp(12px, 3.3vw, 15px); font-weight: 700; opacity: 0.9; margin-top: 0.15em; font-variant-numeric: tabular-nums; }
    /* R3 fix1: 自動で写せないとき（artifact の iframe など）の手で写す箱。縦横どちらでも画面に収める */
    .result-copybox { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.7em;
      padding: max(4vh, 14px) 5vw; box-sizing: border-box; background: rgba(8, 5, 18, 0.94); user-select: text; -webkit-user-select: text; touch-action: auto; }
    .result-copybox p { margin: 0; max-width: 34em; font-size: clamp(12px, 3.4vw, 15px); font-weight: 700; line-height: 1.45; opacity: 0.9; }
    .result-copybox textarea { width: min(90vw, 560px); height: min(42vh, 260px); flex: 0 1 auto; min-height: 5.5em; box-sizing: border-box; resize: none; padding: 0.7em 0.8em;
      font: inherit; font-size: clamp(12px, 3.4vw, 15px); line-height: 1.5; color: #fff; background: #1d1430; border: 1.5px solid rgba(255, 255, 255, 0.5); border-radius: 10px;
      user-select: text; -webkit-user-select: text; }
    /* fix2: #result の長押しの止め（touch-callout・user-select・touch-action）は ID の規則なので、同じ強さ以上で箱の中だけ戻す（携帯で長押しして選べる） */
    #result .result-copybox, #result .result-copybox * { -webkit-touch-callout: default; user-select: text; -webkit-user-select: text; touch-action: auto; }
    @media (min-aspect-ratio: 1/1) { .result-copybox textarea { height: min(50vh, 260px); } .result-copybox { gap: 0.5em; } }
    .result-note { position: fixed; left: 50%; top: max(3vh, 14px); transform: translateX(-50%); padding: 0.5em 1.2em; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #1a1026; font-size: 15px; font-weight: 800; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4); pointer-events: none; }
    .result-breakdown { font-size: clamp(11px, 3.1vw, 15px); font-weight: 600; opacity: 0.72; line-height: 1.55; margin-top: 0.2em; font-variant-numeric: tabular-nums; }
    .result-title { font-size: clamp(13px, 3.6vw, 18px); font-weight: 700; letter-spacing: 0.5em; padding-left: 0.5em; opacity: 0.6; }
    .result-headline .nobr { display: inline-block; white-space: nowrap; }
    .result-headline { font-size: clamp(36px, 11vw, 72px); font-weight: 900; letter-spacing: 0.06em; margin-top: 0.15em; white-space: nowrap; }
    #result.clear .result-headline { color: #fff6dc; text-shadow: 0 0 28px rgba(255, 200, 110, 0.75), 0 0 6px rgba(255, 230, 170, 0.8); }
    #result.fail .result-headline { font-size: clamp(28px, 8.4vw, 60px); color: #ffd9d2; text-shadow: 0 0 22px rgba(255, 70, 60, 0.6), 0 0 4px rgba(120, 255, 170, 0.35); }
    /* R3: ブラックホールの見出し（11 文字）は縦画面の幅に収める（前は 11vw で両端が切れていた） */
    @media (max-aspect-ratio: 1/1) { #result.blackhole .result-headline { font-size: clamp(24px, 7.6vw, 60px); } }
    /* R3: 撃退失敗の横画面の見出しは縦の長さで抑える（上の行の後に置く。同じ強さの規則は後ろが勝つ） */
    @media (min-aspect-ratio: 1/1) { #result.fail .result-headline { font-size: clamp(20px, 7vh, 40px); } }
    .result-label { font-size: clamp(12px, 3.2vw, 16px); opacity: 0.65; margin-top: 1.4em; letter-spacing: 0.1em; }
    .result-amount { font-size: clamp(22px, 6.4vw, 40px); font-weight: 800; opacity: 0.92; text-shadow: 0 0 16px rgba(255, 180, 90, 0.45); }
    .result-row { display: flex; gap: 1em; margin-top: 1.6em; }
    .result-btn { font: inherit; font-size: clamp(16px, 4.4vw, 22px); font-weight: 700; padding: 0.7em 1.6em; border-radius: 999px; border: 2px solid #fff; background: transparent; color: #fff; cursor: pointer; }
    .result-btn.primary { background: #fff; color: #1b1030; }
    .result-row.sub { margin-top: 0.6em; }
    .result-btn.ghost { border-color: rgba(255, 255, 255, 0.45); font-size: clamp(14px, 3.8vw, 18px); padding: 0.5em 1.4em; opacity: 0.85; }
    /* リプレイの印（上の黒い帯の中）と、飛ばし方（下の黒い帯の中） */
    #replay { position: fixed; inset: 0; pointer-events: none; font-weight: 700; letter-spacing: 0.18em; color: rgba(255, 255, 255, 0.82); }
    #replay[hidden] { display: none; }
    #replay .replay-tag { position: absolute; left: 5vw; top: max(3.2vh, 14px); font-size: clamp(12px, 3.4vw, 16px); display: flex; align-items: center; gap: 0.55em; }
    #replay .replay-tag::before { content: ""; width: 0.6em; height: 0.6em; border-radius: 50%; background: #ff4a3a; box-shadow: 0 0 8px #ff4a3a; animation: replay-blink 1.1s steps(2, start) infinite; }
    #replay .replay-hint { position: absolute; right: 5vw; bottom: max(3.2vh, 14px); font-size: clamp(11px, 3vw, 14px); opacity: 0.6; letter-spacing: 0.1em; }
    @keyframes replay-blink { to { visibility: hidden; } }
    /* 導入（S6）: 2D の層（カード・白・題字）、最初の読み込みの「TAP」、TAP START */
    #intro-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #intro-fx[hidden] { display: none; }
    #intro-gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #000; pointer-events: none; }
    #intro-gate.on { display: flex; }
    #intro-gate span { font-family: "SaigoMincho", serif; font-weight: 900; font-size: clamp(15px, 4vw, 20px); letter-spacing: 0.6em; padding-left: 0.6em; color: #fff; opacity: 0.25; transition: opacity 0.4s; }
    #intro-gate.ready span { opacity: 1; animation: intro-pulse 1.5s ease-in-out infinite; }
    #intro-start { position: fixed; left: 50%; bottom: max(8.5vh, 44px); transform: translateX(-50%); margin: 0; padding: 0.85em 2.1em 0.85em 2.55em; font-family: "SaigoMincho", serif; font-weight: 900; font-size: clamp(15px, 4.2vw, 20px); letter-spacing: 0.45em; white-space: nowrap; color: #0a080c; background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(10, 8, 12, 0.8); border-radius: 2px; opacity: 0; pointer-events: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #intro-start.on { pointer-events: auto; }
    #intro-start.pulse { animation: intro-btn 2.2s ease-in-out infinite; }
    #intro-start[hidden] { display: none; }
    @keyframes intro-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    /* 題字は白い地に黒（持ち主 18:02）。TAP START も黒で、ゆっくり脈打つ */
    @keyframes intro-btn { 0%, 100% { opacity: 0.72; box-shadow: 0 0 0 rgba(0, 0, 0, 0); } 50% { opacity: 1; box-shadow: 0 0 18px rgba(0, 0, 0, 0.22), inset 0 0 10px rgba(0, 0, 0, 0.08); } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="stick"><div class="ring"></div><div class="knob"></div></div>
  <button id="menuBtn" type="button" aria-label="メニュー" aria-expanded="false" hidden><i></i><i></i><i></i></button>
  <div id="menu" role="dialog" aria-label="一時停止" hidden>
    <div class="menu-card">
      <div class="menu-title">一時停止</div>
      <button type="button" data-act="resume" class="menu-main">つづける</button>
      <button type="button" data-act="retry">リトライ</button>
      <label class="menu-vol"><span>BGM</span><input type="range" name="bgm" min="0" max="100" step="1" value="100"></label>
      <label class="menu-vol"><span>効果音</span><input type="range" name="sfx" min="0" max="100" step="1" value="100"></label>
    </div>
  </div>
  <div id="hideMark" hidden><div class="hm-ring"></div><div class="hm-tag">かくれ中</div></div>
  <div id="lookout" hidden><div class="lo-hit"></div><div class="lo-arrow"><b></b><i></i></div><div class="lo-text"></div></div>
  <div id="start">長押しで力を貯め、離して最後の一撃<br><small>貯めながら、もう一本の指を長押しで動く・短くタップで払う（3 回まで）<br>LOOK OUT! が出たら 矢印をタップで物陰に隠れる<br>払うは まわりの者を はがす（重い者・大物は倒れず よろめく）</small></div>
  <div id="replay" hidden><span class="replay-tag">リプレイ</span><span class="replay-hint">タップでとばす</span></div>
  <div id="result" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
