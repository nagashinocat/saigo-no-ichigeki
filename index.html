<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>街破壊（仮題）</title>
  <meta name="description" content="手の中で爆発する力で、街をまるごと吹き飛ばす3Dゲーム。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="街破壊（仮題）">
  <meta property="og:description" content="長押しで力を貯め、離せば最後の一発。60秒で街をまるごと吹き飛ばせ。">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d16; }
    #game, #hud, #start, #result { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #game { display: block; width: 100%; height: 100%; }
    body { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #fff; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    .hud-strip { position: absolute; display: flex; justify-content: space-between; align-items: flex-start; box-sizing: border-box; padding: 0.6em 4vw 0; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.85), 0 0 10px rgba(20, 10, 30, 0.5); }
    .hud-power-text { font-size: clamp(18px, 5.6vw, 30px); font-weight: 800; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
    .hud-time { font-size: clamp(13px, 3.8vw, 20px); font-weight: 700; opacity: 0.92; padding-top: 0.35em; }
    .hud-power { position: absolute; height: 5px; background: rgba(0, 0, 0, 0.45); }
    .hud-power i { display: block; height: 100%; transform-origin: left; background: linear-gradient(90deg, #ffb347, #fff3c4); box-shadow: 0 0 8px #ffc766; }
    .hud-puff { position: absolute; pointer-events: auto; touch-action: none; box-sizing: border-box; margin: 0; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 236, 190, 0.95); background: radial-gradient(circle at 50% 40%, rgba(255, 214, 140, 0.55), rgba(120, 50, 20, 0.55)); color: #fff; font-family: inherit; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.9); box-shadow: 0 0 14px rgba(255, 190, 100, 0.55); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .hud-puff small { font-size: 0.42em; font-weight: 700; opacity: 0.75; }
    .hud-puff:active:not(.off) { transform: scale(0.94); }
    .hud-puff.off { border-color: rgba(255, 255, 255, 0.28); background: rgba(30, 26, 40, 0.5); color: rgba(255, 255, 255, 0.38); box-shadow: none; cursor: default; }
    .hud-hint { position: absolute; text-align: center; font-size: clamp(14px, 4vw, 20px); font-weight: 800; opacity: 0; transition: opacity 0.25s; text-shadow: 0 1px 3px rgba(20, 10, 30, 0.9), 0 0 10px rgba(20, 10, 30, 0.6); }
    .hud-hint.show { opacity: 1; transition: opacity 0.08s; }
    @media (pointer: coarse) { .hud-puff small { display: none; } }
    #start { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; font-size: clamp(16px, 4.6vw, 26px); font-weight: 700; text-shadow: 0 1px 4px rgba(20, 10, 30, 0.9), 0 0 14px rgba(20, 10, 30, 0.6); }
    #start[hidden], #result[hidden], #result [hidden] { display: none; }
    #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4em; background: rgba(12, 8, 24, 0.72); text-align: center; }
    .result-reason { font-size: clamp(16px, 4.4vw, 24px); opacity: 0.85; }
    .result-label { font-size: clamp(13px, 3.6vw, 18px); opacity: 0.7; margin-top: 0.8em; }
    .result-amount { font-size: clamp(40px, 13vw, 84px); font-weight: 900; text-shadow: 0 0 24px rgba(255, 180, 90, 0.6); }
    .result-row { display: flex; gap: 1em; margin-top: 1.6em; }
    .result-btn { font: inherit; font-size: clamp(16px, 4.4vw, 22px); font-weight: 700; padding: 0.7em 1.6em; border-radius: 999px; border: 2px solid #fff; background: transparent; color: #fff; cursor: pointer; }
    .result-btn.primary { background: #fff; color: #1b1030; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="start">長押しで力を貯め、離して最後の一発<br><small>「払う」で軍勢を払う</small></div>
  <div id="result" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
